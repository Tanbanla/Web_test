<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        body {
            background-color: #f8f9fa;
        }

        .form-container {
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin-top: 50px;
        }

        .btn-custom {
            min-width: 100px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <!-- <h2 class="text-center">Form Example</h2> -->
            <div class="form-row align-items-center">
                <!-- Button 1 -->
                <div class="col-auto" style="margin-right:12px;">
                    <button type="button" style="background-color: aquamarine;" class="btn btn-secondary mb-2 btn-custom">Đăng ký thông tin</button>
                </div>
                <h6>Tên người công tác: </h6>
                <!-- Input tìm kiếm -->
                <div class="col-auto">
                    <input type="text" class="form-control mb-2" placeholder="Tìm kiếm..." />
                </div>
                <div class="col-auto">
                    <button type="button" class="btn btn-primary mb-2 btn-custom">Tìm kiếm</button>
                </div>
                <!-- Input 1 -->
                <h6>Tên người đảm nhiệm: </h6>
                <div class="col-auto">
                    <input type="text" class="form-control mb-2" placeholder="Input 1" />
                </div>
                <!-- Button 2 -->
                <div class="col-auto">
                    <button type="button" class="btn btn-success mb-2 btn-custom">Xuất dữ liệu</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
