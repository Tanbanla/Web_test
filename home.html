<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng dụng Chat</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <style>
                body {
                    background-color: #f4f4f4;
                }

                #chatContainer {
                    height: 65vh;
                    max-height: 1200px;
                    overflow-y: auto;
                    border: 1px solid #ccc;
                    background-color: #fff;
                    padding: 10px;
                    border-radius: 5px;
                    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                }

                .message {
                    margin-bottom: 15px;
                }

                .sender {
                    font-weight: bold;
                    color: #007bff;
                }

                .receiver {

                    font-weight: bold;
                    color: #28a745;
                }

                .message-content {
                    border-radius: 5px;
                    padding: 10px;
                    max-width: 75%;
                    display: inline-block;
                }

                .sender .message-content {
                    background-color: #e7f1ff;
                    align-self: flex-end;
                    float: right;
                }

                .receiver .message-content {
                    background-color: #d4edda;
                    align-self: flex-start;
                }

                .chat-input {
                    display: flex;
                    margin-top: 10px;
                }
                .card-img-container {
                    display: flex;
                    justify-content: center;
                    margin-top: 16px;
                }

                .card-container {
                    display: flex;
                    gap: 1rem;
                }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">Ứng dụng Chat</h1>
        <div id="chatContainer" class="d-flex flex-column">
            <div id="loading"></div>
        </div>
        <div>
            <div id="animation-dot" class="loader">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
        <div class="v-image__image v-image__image--contain" style="background-image: url(&quot;https://cdn-static-v3.fpt.ai/upload/2f168ff49f873fc6c09442ac764ed6f9/a93423188b9ea6f08ed5b484f659624f.jpg&quot;); background-position: center top;"></div>
        <!-- <form id="chatForm" class="chat-input">
            <input type="text" name="Sender" value="User1" hidden />
            <input type="text" name="Receiver" value="ChatBot" hidden />
            <input type="text" class="form-control" id="contentInput" name="Content" placeholder="Nhập tin nhắn..." required />
            <button type="submit" class="btn btn-primary ml-2 d-flex align-items-center" id="Send">
                <span class="mr-2">Gửi</span>
                <img src="~/lib/send.png" alt="Send" style="width: 30px; height: 24px;" />
            </button>
        </form> -->
    </div>
</body>
</html>
